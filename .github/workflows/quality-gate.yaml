name: AI Quality Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

# Prevent duplicate runs on same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Generate Tests via LLM ────────────────────────────────────────
  generate-tests:
    name: Generate Tests (Gemini LLM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate Playwright tests from Swagger + LLM
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_tests.py
        # Fail the job (and thus the PR) if generation fails
        # Exit code 1 from the script propagates automatically

      - name: Verify test files were generated
        run: |
          echo "=== Generated API Tests ==="
          ls -la generated_test/tests/api/ || echo "No API tests found!"
          echo "=== Generated E2E Tests ==="
          ls -la generated_test/tests/web/ || echo "No E2E tests found!"

          # Fail if no tests were generated
          API_COUNT=$(find generated_test/tests/api -name "*.spec.ts" 2>/dev/null | wc -l)
          E2E_COUNT=$(find generated_test/tests/web -name "*.spec.ts" 2>/dev/null | wc -l)

          if [ "$API_COUNT" -eq 0 ]; then
            echo "ERROR: No API tests were generated!"
            exit 1
          fi
          if [ "$E2E_COUNT" -eq 0 ]; then
            echo "ERROR: No E2E tests were generated!"
            exit 1
          fi
          echo "✅ Generated $API_COUNT API test(s) and $E2E_COUNT E2E test(s)"

      # Upload generated tests as artifact so next jobs can download them
      - name: Upload generated tests
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: generated_test/tests/
          retention-days: 7

  # ── Job 2: Run API Tests ──────────────────────────────────────────────────
  api-tests:
    name: API Tests (Playwright)
    runs-on: ubuntu-latest
    needs: generate-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: generated_test/tests/

      - name: Run API tests
        env:
          TEST_ENV: staging
          STAGING_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8080' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: npm run test:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ── Job 3: Run E2E Tests ──────────────────────────────────────────────────
  e2e-tests:
    name: E2E Frontend Tests (Playwright)
    runs-on: ubuntu-latest
    needs: generate-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download generated tests
        uses: actions/download-artifact@v4
        with:
          name: generated-tests
          path: generated_test/tests/

      - name: Run E2E tests
        env:
          TEST_ENV: staging
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL || 'http://localhost:3000' }}
          STAGING_API_URL: ${{ secrets.STAGING_API_URL || 'http://localhost:8080' }}
        run: npm run test:web

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 30

  # ── Job 4: Quality Gate Summary ───────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    # Always run to provide summary even on failure
    if: always()

    steps:
      - name: Evaluate quality gate
        run: |
          API_RESULT="${{ needs.api-tests.result }}"
          E2E_RESULT="${{ needs.e2e-tests.result }}"

          echo "=== Quality Gate Results ==="
          echo "API Tests:  $API_RESULT"
          echo "E2E Tests:  $E2E_RESULT"

          if [ "$API_RESULT" != "success" ] || [ "$E2E_RESULT" != "success" ]; then
            echo ""
            echo "❌ QUALITY GATE FAILED — PR cannot be merged."
            echo "   Fix failing tests before merging."
            exit 1
          fi

          echo ""
          echo "✅ QUALITY GATE PASSED — All tests passed."
