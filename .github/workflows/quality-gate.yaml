name: AI Quality Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ── Job 1: Generate or Use Cached Tests ───────────────────────────────────
  generate-tests:
    name: Generate Tests (Gemini LLM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate tests (with cache fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Attempting LLM test generation..."
          python scripts/generate_tests.py || {
            echo "⚠️  LLM generation failed (rate limit or quota). Using pre-generated tests from repo."
            echo "This is expected behavior — pre-generated tests serve as intelligent cache."
          }

      - name: Verify test files exist (generated or pre-existing)
        run: |
          echo "=== API Tests ==="
          ls -la generated_test/tests/api/*.spec.ts || ls -la tests/api/*.spec.ts
          echo "=== E2E Tests ==="
          ls -la generated_test/tests/web/*.spec.ts || ls -la tests/web/*.spec.ts

          API_COUNT=$(find . -path "*/tests/api/*.spec.ts" 2>/dev/null | wc -l)
          E2E_COUNT=$(find . -path "*/tests/web/*.spec.ts" 2>/dev/null | wc -l)

          if [ "$API_COUNT" -eq 0 ]; then
            echo "ERROR: No API tests found!"
            exit 1
          fi
          if [ "$E2E_COUNT" -eq 0 ]; then
            echo "ERROR: No E2E tests found!"
            exit 1
          fi
          echo "✅ Found $API_COUNT API test(s) and $E2E_COUNT E2E test(s)"

      - name: Upload test files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-tests
          path: |
            tests/
            generated_test/tests/
          retention-days: 7

  # ── Job 2: Run API Tests ──────────────────────────────────────────────────
  api-tests:
    name: API Tests (Playwright)
    runs-on: ubuntu-latest
    needs: generate-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Go API server
        run: |
          # Install Go
          sudo apt-get install -y golang-go || true
          # Try to start backend if go files exist
          if [ -f "main.go" ]; then
            go run main.go &
            sleep 3
            echo "Go API server started"
          else
            echo "No main.go found — skipping backend start"
            echo "Tests will run against STAGING_API_URL"
          fi

      - name: Run API tests
        env:
          TEST_ENV: staging
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: npm run test:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ── Job 3: Quality Gate Summary ───────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [api-tests]
    if: always()

    steps:
      - name: Evaluate quality gate
        run: |
          API_RESULT="${{ needs.api-tests.result }}"

          echo "=== Quality Gate Results ==="
          echo "API Tests: $API_RESULT"

          if [ "$API_RESULT" != "success" ]; then
            echo "❌ QUALITY GATE FAILED"
            exit 1
          fi

          echo "✅ QUALITY GATE PASSED"
